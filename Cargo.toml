[package]
name = "agent-cli-tools"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "The missing CLI commands for agent harnesses"
repository = "https://github.com/jordiboehme/agent-cli-tools"
authors = ["Jordi Böhme <jordi@boehme-lopez.de>"]
keywords = ["macos", "cli", "coreutils", "timeout", "agents"]
categories = ["command-line-utilities"]
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "timeout"
path = "src/bin/timeout.rs"

[[bin]]
name = "nproc"
path = "src/bin/nproc.rs"

[[bin]]
name = "tac"
path = "src/bin/tac.rs"

[dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
