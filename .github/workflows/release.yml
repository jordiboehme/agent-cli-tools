name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: builds, signs when secrets exist, packages, and stops
  # short of publishing. The publish and homebrew jobs only run for a tag.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Every binary the package builds, space separated. Adding a command means
  # adding its name here and a bin.install line in the formula below.
  BINARIES: timeout nproc tac

# Read only by default. The jobs that publish name the scopes they need in
# their own `permissions:` block.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    # Notarization submits the binaries one after another and allows each 30
    # minutes; on a slow Apple queue that alone can approach 90 minutes.
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            platform: macos-intel
            # The last Intel image GitHub ships; it retires in August 2027.
            os: macos-15-intel
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Add release target
        run: rustup target add "$TARGET"

      # No Rust cache in a release build: a tag run can only restore what
      # main saved, so a poisoned cache entry would end up in a signed binary.

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # A tag that disagrees with Cargo.toml would ship a binary whose
      # --version lies about itself. Catch it before anything is built.
      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          manifest="v$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi

      # cargo-auditable embeds the resolved dependency list in a section of
      # the binary (a few kB), so `cargo audit bin`, Trivy, Grype and
      # osv-scanner can name the crates inside a shipped binary later. The
      # install action fetches a prebuilt binary and checks it against the
      # SHA-256 in its manifest; `fallback: none` fails the step rather than
      # downloading an unpinned binary.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      # --locked: Cargo.lock is the build's input, and a lockfile that would
      # need an update fails the build instead of being re-resolved here.
      - name: Build
        run: cargo auditable build --release --locked --target "$TARGET"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          for bin in $BINARIES; do
            path="target/$TARGET/release/$bin"
            [ -f "$path" ] || { echo "::error::$path is missing"; exit 1; }
            "$path" --version
          done
          dir="target/$TARGET/release"
          "$dir/timeout" 5 true
          rc=0
          "$dir/timeout" 0.2 sleep 5 || rc=$?
          [ "$rc" -eq 124 ]
          test "$("$dir/nproc" --ignore=99999)" = "1"
          printf 'a\nb\n' | "$dir/tac" | head -1 | grep -qx b

      # Sign each bare Mach-O with a Developer ID Application certificate
      # under the hardened runtime, then notarize with notarytool. A bare
      # binary cannot carry a stapled ticket, so Gatekeeper checks online on
      # first run. A tag build must sign; a dry run without any secrets
      # produces unsigned binaries and says so.
      - name: Decide whether to sign and notarize
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -eq 6 ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::notice::Apple signing secrets are not configured; this dry run produces UNSIGNED binaries"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Apple signing secrets missing (${missing[*]}); a tag build must sign and a partial secret set is always a misconfiguration"
            exit 1
          fi

      - name: Set up signing keychain
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$cert"

      - name: Sign the binaries
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity found in the signing keychain"
            exit 1
          fi
          for bin in $BINARIES; do
            path="target/$TARGET/release/$bin"
            identifier="io.github.jordiboehme.agent-cli-tools.$bin"
            codesign --force --timestamp --options runtime \
              --identifier "$identifier" \
              --keychain "$keychain" \
              --sign "$identity" \
              "$path"
            codesign --verify --strict --verbose=2 "$path"
            info="$(codesign --display --verbose=2 "$path" 2>&1)"
            echo "$info"
            grep -q "Identifier=$identifier" <<< "$info"
            grep -q "TeamIdentifier=${APPLE_TEAM_ID}" <<< "$info"
            grep -q "(runtime)" <<< "$info"
          done

      - name: Notarize the binaries
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          zip="$RUNNER_TEMP/notarize.zip"
          rm -f "$zip"
          for bin in $BINARIES; do
            ditto -c -k --keepParent "target/$TARGET/release/$bin" "$RUNNER_TEMP/notarize-$bin.zip"
          done
          for bin in $BINARIES; do
            result="$RUNNER_TEMP/notarize-$bin.json"
            set +e
            xcrun notarytool submit "$RUNNER_TEMP/notarize-$bin.zip" \
              --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              --wait --timeout 30m --output-format json > "$result"
            submit_rc=$?
            set -e
            cat "$result"
            status="$(jq -r '.status // "unknown"' "$result")"
            if [ "$submit_rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
              echo "::error::notarization of $bin failed (notarytool exit $submit_rc, status $status)"
              submission_id="$(jq -r '.id // empty' "$result")"
              if [ -n "$submission_id" ]; then
                xcrun notarytool log "$submission_id" \
                  --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
              fi
              exit 1
            fi
          done
          rm -f "$RUNNER_TEMP"/notarize-*.zip

      - name: Smoke test the signed binaries
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for bin in $BINARIES; do
            "target/$TARGET/release/$bin" --version
          done
          "target/$TARGET/release/timeout" 5 true

      - name: Delete signing keychain
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP"/notarize-*

      - name: Stage and package
        id: stage
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="agent-cli-tools-${RELEASE_VERSION}-${PLATFORM}"
          stage="dist/$name"
          mkdir -p "$stage"
          for bin in $BINARIES; do
            cp "target/$TARGET/release/$bin" "$stage/"
          done
          cp LICENSE README.md "$stage/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-cli-tools-${{ matrix.platform }}
          path: dist/${{ steps.stage.outputs.name }}.tar.gz
          if-no-files-found: error

  # One CycloneDX SBOM per release target. No tag guard: a workflow_dispatch
  # dry run generates them too, it just has nowhere to publish them.
  sbom:
    name: generate the SBOMs
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Read only: the tools this job installs never get a token that can write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      # The same version string the archives carry, so an SBOM sits next to
      # the archive it describes under the same prefix.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      # cargo-cyclonedx writes the file next to Cargo.toml. It has no --locked
      # flag; the diff check at the end proves it did not touch the lockfile.
      - name: Generate the SBOMs
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          while read -r target platform; do
            [ -n "$target" ] || continue
            name="agent-cli-tools-${RELEASE_VERSION}-${platform}.cdx"
            cargo cyclonedx --format json --spec-version 1.5 \
              --target "$target" --override-filename "$name"
            mv "${name}.json" "sbom/${name}.json"
          done <<'TARGETS'
          aarch64-apple-darwin macos-arm64
          x86_64-apple-darwin macos-intel
          TARGETS
          git diff --exit-code Cargo.lock
          for f in sbom/*.cdx.json; do
            jq -e '[.components[].name] | index("libc") != null' "$f" > /dev/null
          done
          ls -la sbom

      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, sbom]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    # id-token and attestations: keyless signing of the attestations below
    # (Sigstore through GitHub's OIDC token), nothing else.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all archives and SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads

      - name: Collect assets and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find downloads -type f \( -name '*.tar.gz' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
          ls -la

      # actions/attest fails only when a whole subject list matches nothing,
      # so a renamed asset would drop out of its attestation without a sound.
      # Every path the attest steps below use is checked here first.
      - name: Check the attestation subjects exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in SHA256SUMS \
            "agent-cli-tools-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            "agent-cli-tools-${GITHUB_REF_NAME}-macos-arm64.cdx.json" \
            "agent-cli-tools-${GITHUB_REF_NAME}-macos-intel.tar.gz" \
            "agent-cli-tools-${GITHUB_REF_NAME}-macos-intel.cdx.json"; do
            [ -f "release/$f" ] || { echo "::error::missing attestation subject release/$f"; missing=1; }
          done
          exit "$missing"

      # Build provenance for every release asset, SHA256SUMS and the SBOMs
      # included. Verify with
      # `gh attestation verify <file> --repo jordiboehme/agent-cli-tools`.
      # Before the release is created, so a failed attestation stops the
      # release rather than leaving it published without provenance.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Attest the macos-arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/agent-cli-tools-${{ github.ref_name }}-macos-arm64.cdx.json
          subject-path: release/agent-cli-tools-${{ github.ref_name }}-macos-arm64.tar.gz

      - name: Attest the macos-intel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: release/agent-cli-tools-${{ github.ref_name }}-macos-intel.cdx.json
          subject-path: release/agent-cli-tools-${{ github.ref_name }}-macos-intel.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  homebrew:
    name: update homebrew tap
    needs: publish
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    steps:
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"

      - name: Regenerate and push the formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          sums="$RUNNER_TEMP/release/SHA256SUMS"
          sha_arm=$(grep "agent-cli-tools-${TAG}-macos-arm64.tar.gz" "$sums" | awk '{print $1}')
          sha_intel=$(grep "agent-cli-tools-${TAG}-macos-intel.tar.gz" "$sums" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/jordiboehme/homebrew-tap.git" \
            "$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$RUNNER_TEMP/homebrew-tap/Formula"

          cat > "$RUNNER_TEMP/homebrew-tap/Formula/agent-cli-tools.rb" << FORMULA
          class AgentCliTools < Formula
            desc "The missing CLI commands for agent harnesses"
            homepage "https://github.com/jordiboehme/agent-cli-tools"
            license "MIT"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "https://github.com/jordiboehme/agent-cli-tools/releases/download/v#{version}/agent-cli-tools-v#{version}-macos-arm64.tar.gz"
                sha256 "${sha_arm}"
              end

              on_intel do
                url "https://github.com/jordiboehme/agent-cli-tools/releases/download/v#{version}/agent-cli-tools-v#{version}-macos-intel.tar.gz"
                sha256 "${sha_intel}"
              end
            end

            # tree and watch are homebrew-core formulae. Shipping binaries by
            # those names would collide on link and, because one conflict
            # unlinks the whole keg, would take timeout down with them.
            depends_on "tree"
            depends_on "watch"

            def install
              bin.install "timeout", "nproc", "tac"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/timeout --version")
              shell_output("#{bin}/timeout 0.1 sleep 5", 124)
              assert_match(/\A\d+\Z/, shell_output("#{bin}/nproc").strip)
              assert_equal "b\na\n", pipe_output("#{bin}/tac", "a\nb\n")
            end
          end
          FORMULA

          cd "$RUNNER_TEMP/homebrew-tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-cli-tools.rb
          git commit -m "Update agent-cli-tools to ${VERSION}"
          git push
